name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r growmi/requirements.txt -r growmi/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: growmi
      - run: pip install pyyaml jinja2 pytest
      - run: python -m pytest -q tests
