{% extends "base.html" %}
{% block title %}Eintrag ändern{% endblock %}
{% block content %}
<h1>Eintrag ändern</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ root }}/eintrag/{{ kind }}/{{ e.id }}/bearbeiten">
  <input type="hidden" name="back" value="{{ back }}">
  <label>Zeit <input type="datetime-local" name="ts" value="{{ e.ts }}"></label>
  {% if kind == 'watering' %}
  <label><span>Liter <span class="req" aria-hidden="true">*</span></span><input name="liters" inputmode="decimal" required value="{{ '%g' % e.liters }}"></label>
  <label>pH <input name="ph" inputmode="decimal" value="{{ e.ph if e.ph is not none else '' }}"></label>
  <label>EC <input name="ec" inputmode="decimal" value="{{ e.ec if e.ec is not none else '' }}"></label>
  <fieldset><legend>Pflanzen</legend>
    <input type="hidden" name="edit_plants" value="1">
    {% for p in all_plants %}<label class="check"><input type="checkbox" name="plant_ids" value="{{ p.id }}" {{ 'checked' if p.id in checked }}> Platz {{ p.slot }} · {{ p.sorte }}{{ tr(' (ausgezogen)') if p.ausgezogen_am }}</label>{% endfor %}
  </fieldset>
  {% elif kind == 'intervention' %}
  <label>Art <select name="art">{% for a in arten %}<option value="{{ a }}" {{ 'selected' if a == e.art }}>{{ tr(a) }}</option>{% endfor %}</select></label>
  <label>Text <textarea name="text" rows="3">{{ e.text }}</textarea></label>
  {% endif %}
  <button class="btn">Speichern</button>
</form>
{% endblock %}
