{% extends "base.html" %}
{% block title %}Pflanze einsetzen{% endblock %}
{% block content %}
<h1>Pflanze einsetzen</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ root }}/pflanze/neu">
  <label>Platz <select name="slot">{% for s in slots() %}<option value="{{ s }}" {{ 'selected' if s == slot }}>Platz {{ s }}{{ '' if s in free_slots else tr(' (belegt)') }}</option>{% endfor %}</select></label>
  {% if strains %}
  <label>Vorlage (gespeicherte Sorte)
    <select id="vorlage" name="vorlage">
      <option value="">– neue Sorte eintippen –</option>
      {% for s in strains %}<option value="{{ s.id }}" data-sorte="{{ s.sorte }}" data-hersteller="{{ s.hersteller }}" data-typ="{{ s.typ or '' }}">{{ s.sorte }}{% if s.hersteller %} · {{ s.hersteller }}{% endif %}</option>{% endfor %}
    </select>
  </label>
  {% endif %}
  <label><span>Sorte <span class="req" aria-hidden="true">*</span></span><input id="sorte" name="sorte" required value="{{ form.sorte or '' }}"></label>
  <label>Hersteller / Seedbank <input id="hersteller" name="hersteller" value="{{ form.hersteller or '' }}"></label>
  <label>Typ <select name="typ" id="typ"><option value="">–</option><option value="photo" {{ 'selected' if form.typ == 'photo' }}>Photoperiodisch</option><option value="auto" {{ 'selected' if form.typ == 'auto' }}>Autoflower</option></select></label>
  <label>Keimdatum <input type="date" name="keimdatum" value="{{ form.keimdatum or '' }}"></label>
  <label>Phase <select name="phase">{% for ph in phases %}<option value="{{ ph }}" {{ 'selected' if ph == form.phase }}>{{ tr(ph) }}</option>{% endfor %}</select></label>
  <label>Topf / Substrat <input name="topf" value="{{ form.topf or '' }}"></label>
  <label>Notiz <textarea name="notiz" rows="3">{{ form.notiz or '' }}</textarea></label>
  <label>Eingesetzt am <input type="datetime-local" name="eingesetzt_am" value="{{ eingesetzt_am }}"></label>
  <button class="btn">Einsetzen</button>
</form>
<script>
  // picking a saved strain fills the two fields, which stay editable
  document.getElementById("vorlage")?.addEventListener("change", (e) => {
    const o = e.target.selectedOptions[0];
    if (o.value) {
      document.getElementById("sorte").value = o.dataset.sorte;
      document.getElementById("hersteller").value = o.dataset.hersteller;
      document.getElementById("typ").value = o.dataset.typ;
    }
  });
</script>
{% endblock %}
